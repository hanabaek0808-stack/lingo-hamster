<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingo Hamster 🐹</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🐹 Lingo Hamster</h1>

    <p>Learn languages. Have fun. Grow your vocabulary.</p>

    <h2>Choose Your Language</h2>

    <select id="language">
        <option>English 🇬🇧</option>
        <option>Spanish 🇪🇸</option>
        <option>French 🇫🇷</option>
        <option>Italian 🇮🇹</option>
        <option>Chinese 🇨🇳</option>
        <option>Korean 🇰🇷</option>
        <option>Japanese 🇯🇵</option>
        <option>German 🇩🇪</option>
        <option>Arabic 🇸🇦</option>
        <option>Russian 🇷🇺</option>
        <option>Urdu 🇵🇰</option>
    </select>

    <br><br>

    <button>🚀 Start Learning</button>

    <h2>What do you want to practice?</h2>

    <button>📚 Vocabulary</button>
    <button>🧠 Practice</button>
    <button>📖 Stories</button>
    <button>🎧 Listening</button>
    <button>🎤 Speaking</button>
    <button>✍️ Writing</button>

    <h2>⭐ Your Progress</h2>

    <p>⭐ XP: 0</p>
    <p>🔥 Streak: 0 days</p>

    <h2>🐹 Welcome to Lingo Hamster!</h2>

    <p>Your journey to learning new languages starts here.</p>

</body>
  </html>
